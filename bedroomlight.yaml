esphome:
  name: bedroomlight
  friendly_name: BedRoomLight

esp8266:
  board: esp8285

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  post_connect_roaming: false
  networks:
    - ssid: !secret wifi_networks_ssid
      password: !secret wifi_networks_password
      bssid: !secret wifi_networks_bssid
      priority: 2.0

    - ssid: !secret wifi_networks_ssid_2
      password: !secret wifi_networks_password_2
      priority: 1.0

  power_save_mode: none
  fast_connect: true
  output_power: 17dB
  reboot_timeout: 5min


captive_portal:

# Enable Web server
web_server:
  port: 80


sensor:

status_led:
  pin:
    number: GPIO13
    inverted: true


packages:
  wall_controls: !include packages/wall_switch_controls.yaml

substitutions:
  smart_bulbs: "false"
